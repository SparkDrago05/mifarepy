[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mifarepy"
dynamic = ["version"]
description = "Python library for interfacing with MIFARE RFID card readers using the GNetPlus® protocol"
authors = [
    { name = "Spark Drago", email = "huzaifa.farooq05@gmail.com" }
]
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING"]
dependencies = [
    "pyserial"
]
requires-python = ">=3.9"
readme = { file = "README.md", content-type = "text/markdown" }
keywords = ["mifare", "rfid", "nfc", "gnetplus", "card-reader", "serial", "pyserial"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/SparkDrago05/mifarepy"
Documentation = "https://sparkdrago05.github.io/mifarepy/"
Source = "https://github.com/SparkDrago05/mifarepy"
Issues = "https://github.com/SparkDrago05/mifarepy/issues"

[tool.setuptools]
packages = ["mifarepy"]

[tool.setuptools.package-data]
mifarepy = ["*.txt", "*.md", "py.typed"]

[tool.setuptools.dynamic]
version = {attr = "mifarepy.__version__"}

[project.optional-dependencies]
dev = [
  "pytest",
]