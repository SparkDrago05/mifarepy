[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mifarepy"
dynamic = ["version"]
description = "Python library for interfacing with MIFARE RFID card readers using the GNetPlus® protocol"
authors = [
    { name = "Spark Drago", email = "huzaifa.farooq05@gmail.com" }
]
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING"]
dependencies = [
    "pyserial"
]
requires-python = ">=3.9"
readme = { file = "README.md", content-type = "text/markdown" }
keywords = ["mifare", "rfid", "nfc", "gnetplus", "card-reader", "serial", "pyserial"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/SparkDrago05/mifarepy"
Documentation = "https://sparkdrago05.github.io/mifarepy/"
Source = "https://github.com/SparkDrago05/mifarepy"
Issues = "https://github.com/SparkDrago05/mifarepy/issues"

[tool.setuptools]
packages = ["mifarepy"]

[tool.setuptools.package-data]
mifarepy = ["*.txt", "*.md", "py.typed"]

[tool.setuptools.dynamic]
version = {attr = "mifarepy.__version__"}

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy",
  "types-pyserial",
]
docs = [
  "mkdocs-material",
  "mkdocstrings[python]",
  "mike",
  "mkdocs-git-authors-plugin",
]
[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E701"]
"examples/*" = ["E402"]

[tool.mypy]
files = ["mifarepy"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["mifarepy"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
