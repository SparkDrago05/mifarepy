name: One-off repository maintenance

# Temporary workflow: deletes merged branches and repairs broken links in old
# release notes. Removed again once it has run.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Delete merged branches
        run: |
          for b in fix/phase1-cleanup feat/phase1-value-ops-4k; do
            if gh api "repos/$REPO/branches/$b" >/dev/null 2>&1; then
              ahead=$(gh api "repos/$REPO/compare/main...$b" --jq .ahead_by)
              if [ "$ahead" = "0" ]; then
                gh api -X DELETE "repos/$REPO/git/refs/heads/$b" && echo "deleted $b"
              else
                echo "::warning::$b has $ahead commits not on main; kept"
              fi
            else
              echo "$b already gone"
            fi
          done

      - name: Repair links in old release notes
        run: |
          python3 - <<'EOF'
          import json, os, subprocess

          repo = os.environ['REPO']
          fixes = {
              'v2.0': {
                  'https://github.com/%E2%80%A6/releases/tag/v2.0':
                      'https://github.com/SparkDrago05/mifarepy/releases/tag/v2.0',
                  'https://mifarepy.readthedocs.io/en/v2.0':
                      'https://sparkdrago05.github.io/mifarepy/2.0/',
              },
              'v1.0.3': {
                  'https://aarsol-pvt-ltd.github.io/mifarepy/':
                      'https://sparkdrago05.github.io/mifarepy/1.0.3/',
                  'https://github.com/AARSOL-Pvt-Ltd/mifarepy':
                      'https://github.com/SparkDrago05/mifarepy',
              },
          }
          for tag, pairs in fixes.items():
              rel = json.loads(subprocess.check_output(
                  ['gh', 'api', f'repos/{repo}/releases/tags/{tag}']))
              body = rel['body']
              new = body
              for old, repl in pairs.items():
                  new = new.replace(old, repl)
              if new == body:
                  print(f'{tag}: nothing to change')
                  continue
              subprocess.run(
                  ['gh', 'api', '-X', 'PATCH', f'repos/{repo}/releases/{rel["id"]}',
                   '-f', f'body={new}'],
                  check=True, stdout=subprocess.DEVNULL)
              print(f'{tag}: links repaired')
          EOF
